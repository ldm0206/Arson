name: Build

# 每次推送/PR 编译验证；打 v* 标签时额外发布 Release 压缩包。
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: 安装 NuGet
        uses: nuget/setup-nuget@v4

      - name: 还原 NuGet 包
        run: nuget restore Arson.sln

      - name: 编译（Release）
        # 引用程序集来自仓库内 Managed 目录（csproj 自动检测）；
        # SkipDeploy 关闭本地游戏目录部署（PostBuild 事件），CI 上不需要。
        run: msbuild Arson.sln /nologo /m /p:Configuration=Release /p:SkipDeploy=true

      - name: 打包
        shell: pwsh
        run: |
          $out = "package/Arson"
          New-Item -ItemType Directory -Force $out | Out-Null

          Copy-Item bin/Release/Arson.dll $out
          Copy-Item packages/CitiesHarmony.API.*/lib/net35/CitiesHarmony.API.dll $out
          Copy-Item packages/UnifiedUILib.*/lib/net35/UnifiedUILib.dll $out
          Copy-Item -Recurse Translations $out/Translations
          Copy-Item -Recurse Resources $out/Resources

          Compress-Archive -Path $out -DestinationPath "package/Arson.zip" -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Arson-${{ github.run_number }}
          path: package/Arson.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: package/Arson.zip
          generate_release_notes: true
